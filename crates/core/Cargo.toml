[package]
name = "tast2controller-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.9.4"
cfb-mode = "0.8.2"
aes-gcm = "0.10.3"
hmac = "0.12.1"
sha2 = "0.10.8"
k256 = { version = "0.13.4", features = ["ecdh"] }
rand = "0.8.5"
