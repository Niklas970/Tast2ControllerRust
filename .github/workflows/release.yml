name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.2"
        required: true
        default: "v0.2.2"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust version Rune needs
        working-directory: gui
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
      - name: Build
        working-directory: gui
        run: cargo build --release
      - name: Check that the tag matches the program version
        shell: pwsh
        run: |
          $v = (& gui/target/release/tast2controller.exe --version).Split(' ')[-1].Trim()
          if ("v$v" -ne "${{ inputs.tag }}") {
            Write-Error "Tag ${{ inputs.tag }} does not match the program version $v (bump version in Cargo.toml and gui/Cargo.toml); the updater compares these."
            exit 1
          }
      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item gui/target/release/tast2controller.exe tast2controller.exe
          $h = (Get-FileHash tast2controller.exe -Algorithm SHA256).Hash.ToLower()
          "$h  tast2controller.exe" | Out-File -Encoding ascii tast2controller.exe.sha256
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" --target "${{ github.sha }}" tast2controller.exe tast2controller.exe.sha256 --title "${{ inputs.tag }}" --notes "Unsigned Windows build (verify the SHA-256 in the .sha256 file). Early development, not yet tested on a real PS5. Use only in story or offline games."
